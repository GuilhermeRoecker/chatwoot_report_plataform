<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Softcam - Relatorios Chat</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <!-- COLUNA LATERAL -->
      <aside class="sidebar">
        <h2>Filtros</h2>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Ex: Braço do Norte/SC" />

        <label for="usuario">Usuário:</label>
        <input
          type="text"
          id="usuario"
          placeholder="Digite um nome de usuário"
        />

        <label for="data-inicio">Data Início:</label>
        <input type="date" id="data-inicio" />

        <label for="data-fim">Data Fim:</label>
        <input type="date" id="data-fim" />

        <button id="btn-buscar">Buscar Conversas</button>
        <button id="btn-limpar-filtros" class="secondary">Limpar Filtros</button>
        <div id="loading-indicator" style="display: none; text-align: center; margin-top: 10px;">Carregando...</div>
        <div id="quantidade-conversas"></div>
        <ul id="lista-conversas"></ul>

        <div class="filtro-extra">
          <label for="nao-mostrar-privadas" style="display: flex; align-items: center; font-size: 12px; cursor: pointer;">
            <input type="checkbox" id="nao-mostrar-privadas" style="margin-right: 8px;">
            Não incluir mensagens privadas no relatório completo
          </label>
          <label for="nao-mostrar-sistema" style="display: flex; align-items: center; font-size: 12px; cursor: pointer; margin-top: 5px;">
            <input type="checkbox" id="nao-mostrar-sistema" style="margin-right: 8px;">
            Não incluir mensagens do sistema no relatório completo
          </label>
        </div>

          <button class="icon-print" id="btn-imprimir-resumo" title="Imprimir">
            <i class="fa-solid fa-print" style="color: #000000"></i>
            Imprimir resumo
          </button>

          <button class="icon-print" id="btn-imprimir-completo" title="Imprimir">
            <i class="fa-solid fa-print" style="color: #000000"></i>
            Imprimir com conversa
          </button>

          <button class="icon-print" id="btn-imprimir-resumo-cidade" title="Imprimir">
            <i class="fa-solid fa-print" style="color: #000000"></i>
            Imprimir resumo por cidade
          </button>

          <button class="icon-print" id="btn-imprimir-resumo-tempo" title="Imprimir">
            <i class="fa-solid fa-print" style="color: #000000"></i>
            Imprimir por TMA
          </button>

      </aside>

      <!-- CHAT -->
      <main class="chat-area">
        <div class="chat-header">
          <h2>Chat</h2>

          <div class="chat-header-buttons">
            <button id="btn-config" class="icon-config" title="Configurações">
              <i class="fa-solid fa-cog" style="color: #000000"></i>
            </button>

            <button class="icon-logoff" title="Sair">
              <i class="fa-solid fa-power-off" style="color: #ffffff"></i>
            </button>
          </div>
        </div>

        <div class="chat-messages" id="chat">
          <!-- Mensagens do chat vão aqui -->
        </div>
      </main>
    </div>

    <div id="config-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Configurações de Filtro</h2>

        <div class="modal-section">
          <h3>Agrupar por:</h3>
          <select id="agrupar-por">
            <option value="conversa">Conversa</option>
            <option value="cidade">Cidade</option>
            <option value="suporte">Agente de Suporte</option>
            <option value="solicitante">Solicitante</option>
          </select>
        </div>

        <div class="modal-section">
          <h3>Ordenar por:</h3>
          <select id="ordenar-por">
            <option value="data">Data</option>
            <option value="numero_chats">Número de Chats</option>
            <option value="tempo_conversa">Tempo de Conversa</a_option>
          </select>
        </div>
        <button id="btn-aplicar-filtros-modal" class="primary">Aplicar</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
